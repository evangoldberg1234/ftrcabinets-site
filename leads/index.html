<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FTR Leads CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crm.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="app">
    <header class="crm-header">
      <div class="crm-header-inner">
        <a class="logo" href="../">FTR <span>Cabinets</span></a>
        <div class="crm-header-right">
          <a class="btn btn-ghost" href="https://form.jotform.com/262806148415155" target="_blank" rel="noopener">Quote form</a>
          <span id="user-label" class="user-label hidden"></span>
          <button id="btn-signout" class="btn btn-ghost hidden" type="button">Sign out</button>
        </div>
      </div>
    </header>

    <main>
      <section id="auth-screen" class="auth-screen">
        <div class="auth-card">
          <p class="eyebrow">Internal CRM</p>
          <h1>Sign in to leads</h1>
          <p class="muted">Allowlisted phone (instant) or email magic link. No password.</p>
          <form id="phone-login-form" class="login-block">
            <label class="field">
              <span>Phone number</span>
              <input id="login-phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(555) 555-0100" />
            </label>
            <button class="btn btn-primary" type="submit">Log in with phone number</button>
          </form>
          <div class="auth-divider"><span>or</span></div>
          <form id="login-form" class="login-block">
            <label class="field">
              <span>Email</span>
              <input id="login-email" type="email" autocomplete="email" placeholder="you@company.com" />
            </label>
            <button class="btn btn-ghost" type="submit">Send magic link</button>
          </form>
          <p id="auth-msg" class="auth-msg" role="status"></p>
        </div>
      </section>

      <section id="crm-screen" class="crm-screen hidden">
        <div class="crm-toolbar">
          <div class="toolbar-row">
            <h1>Leads <span id="lead-count" class="count-pill">0</span></h1>
            <input id="search" type="search" placeholder="Search project, city, developer, contact…" />
          </div>
          <div class="toolbar-row filters">
            <label>State
              <select id="filter-state"><option value="">All</option></select>
            </label>
            <label>Rating
              <select id="filter-rating">
                <option value="">All</option>
                <option>Hot</option>
                <option>Warm</option>
                <option>Cold</option>
              </select>
            </label>
            <label>Status
              <select id="filter-status">
                <option value="">All</option>
                <option>New</option>
                <option>Contacted</option>
                <option>Meeting</option>
                <option>Bidding</option>
                <option>Won</option>
                <option>Lost</option>
                <option>Dead</option>
              </select>
            </label>
            <label class="sort-label">Sort
              <select id="sort-by">
                <option value="score-desc">Score ↓</option>
                <option value="score-asc">Score ↑</option>
                <option value="name">Name</option>
                <option value="status">Status</option>
              </select>
            </label>
          </div>
        </div>
        <div id="cards" class="cards"></div>
        <p id="empty-msg" class="empty-msg hidden">No leads match these filters.</p>
      </section>
    </main>
  </div>

  <dialog id="notes-dialog">
    <form method="dialog" class="notes-panel">
      <header>
        <h2 id="notes-title">Notes</h2>
        <button type="submit" class="btn btn-ghost" value="close">Close</button>
      </header>
      <div id="notes-list" class="notes-list"></div>
      <div class="notes-add">
        <textarea id="note-body" rows="3" placeholder="Add a note…"></textarea>
        <button id="note-save" class="btn btn-primary" type="button">Save note</button>
      </div>
    </form>
  </dialog>

  <script src="crm.js"></script>
</body>
</html>
